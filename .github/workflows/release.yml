# UNI-337: merging a new `version` in package.json publishes unilytics.mcpb as GitHub release v<version>.
# The stable download URL is https://github.com/TeamUnilytics/unilytics-mcp/releases/latest/download/unilytics.mcpb
# Policy: README "Versions and updates". npm publishing stays manual and separate.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  # Finishes a release whose run failed. A published version is never rebuilt.
  workflow_dispatch:

permissions:
  contents: read

# Queued, never cancelled: a run stopped halfway would leave a draft behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # No write access here: this job runs the build tools and our dependencies.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide whether this commit is a new version
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version $version is not X.Y.Z"; exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # This endpoint returns published releases only, so a draft left by a failed run doesn't count.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>/dev/null; then
            echo "$tag is already published: nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `gh release create --target` doesn't move an existing tag, so a stray one would mislabel this build.
          existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::tag $tag already points at $existing, not $GITHUB_SHA"; exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.decide.outputs.publish == 'true'
        with:
          node-version: "24"
      - if: steps.decide.outputs.publish == 'true'
        run: npm ci
      - if: steps.decide.outputs.publish == 'true'
        run: npm test
      - if: steps.decide.outputs.publish == 'true'
        run: npm run build:mcpb
      - if: steps.decide.outputs.publish == 'true'
        run: npm run test:mcpb
      - if: steps.decide.outputs.publish == 'true'
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.decide.outputs.publish == 'true'
        with:
          name: mcpb
          path: dist-mcpb/unilytics.mcpb
          if-no-files-found: error
          retention-days: 1

  # Write access, and it runs nothing from the repo or from npm.
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: unilytics.mcpb
      - name: Remove a draft left by a failed run
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
      # With an asset, gh creates a draft, uploads, then publishes, so "latest" never points at a release without it.
      - name: Publish
        run: gh release create "$TAG" unilytics.mcpb --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      - name: The stable URL serves exactly this file
        run: |
          curl -fsSL -o served.mcpb "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/unilytics.mcpb"
          cmp served.mcpb unilytics.mcpb

  linear:
    needs: [build, publish]
    uses: ./.github/workflows/linear-release.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
