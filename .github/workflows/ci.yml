# Builds and tests the bridge and the .mcpb on every OS Claude Desktop runs on. Node 24 matches Desktop's built-in Node.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build:mcpb
      - run: npm run test:mcpb
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
