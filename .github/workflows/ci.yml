# Builds and tests the bridge and the .mcpb on every OS Claude Desktop runs on. Node 24 matches Desktop's built-in Node.
name: CI

on:
  pull_request:
  # release.yml runs this too: a merge doesn't have to pass CI here, but a release does.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build:mcpb
      - run: npm run test:mcpb
      - name: The live endpoint still keeps the contract installed bridges rely on
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:live
      # Not in a release (workflow_call): a tool renamed on the server must not block a bridge fix from shipping.
      - name: Every tool the README and manifest name is still served
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: npm run test:docs
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
