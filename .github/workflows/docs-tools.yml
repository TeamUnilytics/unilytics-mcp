# UNI-126: tools are retired on the server, which opens no PR here, so the README (the npm page) and the .mcpb
# manifest are checked against the live tools/list every week too. A failure means: edit the tool names they show.
name: Docs tools

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Every tool the README and manifest name is still served
        run: node scripts/check-docs-tools.mjs
