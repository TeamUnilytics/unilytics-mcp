# UNI-409: record a release of unilytics-mcp in the Linear pipeline "unilytics-mcp".
# Called by release.yml once the GitHub release is published. That release is what users download, built by CI from this
# commit and attested (UNI-337), so it no longer waits for the separate, manual npm publish.
name: Linear release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  linear-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: linear/linear-release-action@dd4fc407f860b9460d2cf0b3fb1edd8985cf443f # v0.18.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ inputs.tag }}
